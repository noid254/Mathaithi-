<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Club admin</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ac:#f6c400;--on:#0b0b0f;--bg:#0b0b0f;--s1:#15151c;--s2:#1e1e27;--ln:#2a2a35;--mut:#a3a3b2;--ok:#2ecc71;--bad:#ff6b6b;--d:'Barlow Condensed',Impact,'Arial Narrow',sans-serif}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);color:#fff;font:15px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}
h1,h2,h3{font-family:var(--d);text-transform:uppercase;font-weight:800;line-height:1.05}
.wrap{max-width:900px;margin:0 auto;padding:14px 14px 80px}
.bar{position:sticky;top:0;z-index:20;background:rgba(11,11,15,.96);border-bottom:1px solid var(--ln);backdrop-filter:blur(8px)}
.bar .in{max-width:900px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}.bar b{font:800 20px var(--d);text-transform:uppercase;flex:1}.bar small{color:var(--mut)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;max-width:900px;margin:0 auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 15px;border-radius:999px;background:var(--s1);border:1px solid var(--ln);font:700 13px Inter}.chip.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-top:12px}
.kpi{background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:12px}.kpi small{color:var(--mut);font:700 11px Inter;text-transform:uppercase;letter-spacing:.06em}.kpi b{display:block;font:800 28px/1.1 var(--d);margin-top:4px}.kpi.hl{background:var(--ac);color:var(--on)}.kpi.hl small{color:rgba(0,0,0,.65)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 18px;border-radius:999px;background:var(--ac);color:var(--on);font:800 13px Inter;text-transform:uppercase;letter-spacing:.04em}
.btn.dk{background:var(--s2);color:#fff}.btn.sm{min-height:34px;padding:0 13px;font-size:12px}.btn.bad{background:rgba(255,107,107,.15);color:var(--bad)}
label{display:block;font:700 11px Inter;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:12px 0 5px}
input,select,textarea{width:100%;min-height:44px;padding:10px 12px;background:var(--s2);border:1.5px solid var(--ln);border-radius:10px}textarea{min-height:110px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ac)}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.r3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:11px 0;border-top:1px solid var(--ln)}.row:first-child{border:0}
.row>div{min-width:0}.row small{color:var(--mut)}.pill{display:inline-block;font:700 10.5px Inter;padding:3px 8px;border-radius:999px;background:var(--s2);color:var(--mut);text-transform:uppercase;letter-spacing:.05em}.pill.g{background:rgba(46,204,113,.16);color:var(--ok)}.pill.y{background:var(--ac);color:var(--on)}
table{width:100%;border-collapse:collapse;font-size:13.5px}th{font:700 10.5px Inter;text-transform:uppercase;color:var(--mut);text-align:left;padding:8px 6px;letter-spacing:.06em}td{padding:9px 6px;border-top:1px solid var(--ln);vertical-align:top}.num{text-align:right;white-space:nowrap}
.ph{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.ph div{position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;background:var(--s2)}.ph img{width:100%;height:100%;object-fit:cover}.ph button{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:rgba(0,0,0,.7)}
.note{color:var(--mut);font-size:12px}.err{color:var(--bad);margin-top:8px;font-size:13px}.ok{color:var(--ok)}
.login{max-width:360px;margin:12vh auto;padding:0 16px}.login h1{font-size:44px;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#fff;color:#111;padding:11px 18px;border-radius:999px;font-weight:600;z-index:50;opacity:0;transition:.25s;pointer-events:none}.toast.show{opacity:1}
@media(max-width:560px){.r3{grid-template-columns:1fr 1fr}}
</style></head><body>
<div id="login" class="login"><h1>Club admin</h1><p class="note" style="margin-bottom:16px">Sign in to manage your team.</p>
<form id="lf"><label for="u">Username</label><input id="u" autocomplete="username" autocapitalize="none" required><label for="p">Password</label><input id="p" type="password" autocomplete="current-password" required><button class="btn" style="width:100%;margin-top:16px" type="submit">Sign in</button><div class="err" id="le"></div></form></div>
<div id="app" hidden><div class="bar"><div class="in"><div style="flex:1"><b id="ttl">Admin</b><br><small id="who"></small></div><button class="chip" id="back" hidden>&larr; Super</button><button class="chip" id="out">Sign out</button></div><div class="tabs" id="tabs"></div></div><div class="wrap" id="main"></div></div>
<div class="toast" id="toast"></div>
<script src="/kit.js"></script>
<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s)},tok=null,ME=null,CTX=null,TAB=null,EDIT=null;
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var KES=function(n){return 'KSh '+Math.round(n||0).toLocaleString('en-US')};
var fd=function(i){var d=new Date(i);return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})};
var loc=function(i){var d=new Date(i||Date.now()),p=function(n){return ('0'+n).slice(-2)};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'T'+p(d.getHours())+':'+p(d.getMinutes())};
var tT;function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tT);tT=setTimeout(function(){t.classList.remove('show')},2200)}
function api(path,o){o=o||{};var u=path+(CTX&&path.indexOf('/api/super')!==0?(path.indexOf('?')>0?'&':'?')+'team='+CTX:'');
  return fetch(u,{method:o.method||'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok},body:o.body?JSON.stringify(o.body):undefined}).then(function(r){return r.json().then(function(j){if(!r.ok){if(r.status===401){signOut();}throw new Error(j.error||'Error')}return j})})}
function signOut(){tok=null;try{sessionStorage.removeItem('tok')}catch(e){}$('#app').hidden=true;$('#login').hidden=false}
/* login */
$('#lf').onsubmit=function(e){e.preventDefault();fetch('/api/login',{method:'POST',body:JSON.stringify({username:$('#u').value,password:$('#p').value})}).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error);return j})}).then(function(j){tok=j.token;ME=j.user;try{sessionStorage.setItem('tok',tok)}catch(e){}start()}).catch(function(e){$('#le').textContent=e.message})};
$('#out').onclick=function(){api('/api/logout',{method:'POST'}).catch(function(){});signOut()};
$('#back').onclick=function(){CTX=null;TAB='overview';start(true)};
function start(keep){$('#login').hidden=true;$('#app').hidden=false;$('#who').textContent=ME.name+' · '+(ME.role==='super'?'Super admin':'Team admin');
  if(ME.role==='admin')CTX=null;
  $('#back').hidden=!(ME.role==='super'&&CTX);
  if(!keep||!TAB)TAB=ME.role==='super'&&!CTX?'overview':'dash';tabs();show()}
function tabs(){var t=(ME.role==='super'&&!CTX)?[['overview','Overview'],['teams','Teams'],['store','Store'],['sorders','Orders'],['payouts','Payouts']]:[['dash','Dashboard'],['matches','Matches'],['news','News'],['players','Players'],['table','Table'],['training','Training'],['kits','Kits'],['support','Support'],['inbox','Inbox'],['gallery','Gallery'],['orders','Orders'],['fans','Fans'],['profile','Club']];
  $('#tabs').innerHTML=t.map(function(x){return '<button class="chip'+(TAB===x[0]?' on':'')+'" data-t="'+x[0]+'">'+x[1]+'</button>'}).join('');$('#ttl').textContent=(ME.role==='super'&&CTX)?'Managing '+CTX:(ME.role==='super'?'Super console':'Team console')}
$('#tabs').onclick=function(e){var b=e.target.closest('[data-t]');if(!b)return;TAB=b.getAttribute('data-t');EDIT=null;tabs();show()};
function show(){var f=V[TAB];$('#main').innerHTML='<p class="note">Loading...</p>';f().catch(function(e){$('#main').innerHTML='<p class="err">'+esc(e.message)+'</p>'})}
function kpi(l,v,hl){return '<div class="kpi'+(hl?' hl':'')+'"><small>'+l+'</small><b>'+v+'</b></div>'}
/* photos */
function pick(multi,cb){var i=document.createElement('input');i.type='file';i.accept='image/*';i.multiple=!!multi;i.onchange=function(){var fs=Array.prototype.slice.call(i.files),out=[];(function next(){var f=fs.shift();if(!f){cb(out);return}var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var s=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);api('/api/upload',{method:'POST',body:{data:c.toDataURL('image/jpeg',.82)}}).then(function(j){out.push(j.url);next()}).catch(function(e){toast(e.message);next()})};im.src=r.result};r.readAsDataURL(f)})()};i.click()}
function thumbs(a,k){return '<div class="ph">'+(a||[]).map(function(u,i){return '<div><img src="/'+esc(u)+'" alt=""><button data-rm="'+k+':'+i+'" aria-label="Remove">&times;</button></div>'}).join('')+'</div>'}
var V={};
/* ---------- team admin ---------- */
V.dash=function(){return api('/api/admin/summary').then(function(s){var by=s.by,rows=['kit','shirt','merch','ticket'].filter(function(k){return k!=='shirt'||(by.shirt&&by.shirt.n)}).map(function(k){var b=by[k]||{n:0,amt:0,club:0};return '<tr><td>'+({kit:'Kits',shirt:'Jerseys (old)',merch:'Merchandise',ticket:'Tickets'})[k]+'</td><td class="num">'+b.n+'</td><td class="num">'+KES(b.amt)+'</td><td class="num">'+(s.settings.share[k]!=null?s.settings.share[k]+'%':'your mark-up')+'</td><td class="num"><b>'+KES(b.club)+'</b></td></tr>'}).join('');
  $('#main').innerHTML='<h1 style="font-size:36px;margin-top:6px">'+esc(s.team.name)+'</h1><div class="grid">'+kpi('Orders',s.orders)+kpi('Sales',KES(s.sales))+kpi('You expect',KES(s.expected),1)+kpi('Paid out',KES(s.paid))+kpi('Balance due',KES(s.balance),1)+kpi('Fans',s.fans)+'</div><div class="card"><h3 style="font-size:22px;margin-bottom:8px">What sold</h3><table><tr><th>Item</th><th class="num">Sold</th><th class="num">Sales</th><th class="num">Your share</th><th class="num">You get</th></tr>'+rows+'</table><p class="note" style="margin-top:8px">Jersey price is '+KES(s.settings.jerseyPrice)+'. The parent store prints and ships orders, then pays your share. "Balance due" is what you expect but have not yet been paid.</p></div><div class="card"><h3 style="font-size:22px;margin-bottom:6px">Payments received</h3>'+(s.payouts.length?s.payouts.map(function(p){return '<div class="row"><div><b>'+KES(p.amount)+'</b><br><small>'+esc(p.ref||'')+' '+esc(p.note||'')+'</small></div><small>'+fd(p.at)+'</small></div>'}).join(''):'<p class="note">None yet.</p>')+'</div><div class="card"><h3 style="font-size:22px">Quick actions</h3><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px"><button class="btn sm" data-go="matches">Post a result</button><button class="btn sm dk" data-go="news">Write news</button><button class="btn sm dk" data-go="gallery">Upload photos</button></div></div>'})};
V.matches=function(){return api('/api/admin/matches').then(function(ms){
  var h='<div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px"><h1 style="font-size:36px">Matches</h1><button class="btn sm" data-new="match">+ Fixture</button></div>';
  if(EDIT&&EDIT.k==='match')h+=matchForm(EDIT.v);
  h+='<div class="card">'+(ms.length?ms.map(function(m){return '<div class="row"><div><b>'+(m.home?'vs ':'at ')+esc(m.opp)+'</b> <span class="pill '+(m.status==='result'?'g':'y')+'">'+(m.status==='result'?m.sf+'-'+m.sa:'Upcoming')+'</span><br><small>'+esc(m.squad)+' · '+fd(m.date)+' · '+esc(m.comp||'')+(m.motm?' · MOTM '+esc(m.motm):'')+'</small></div><div style="display:flex;gap:6px;flex:none">'+(m.status==='fixture'?'<button class="btn sm" data-res="'+m.id+'">Add result</button>':'')+'<button class="btn sm dk" data-edit="match:'+m.id+'">Edit</button></div></div>'}).join(''):'<p class="note">No matches yet.</p>')+'</div>';
  $('#main').innerHTML=h;window._ms=ms})};
function matchForm(m){var r=m.status==='result';
  return '<form class="card" id="mf"><h3 style="font-size:24px">'+(m.id?(r?'Match result':'Edit fixture'):'New fixture')+'</h3><div class="r2"><div><label>Squad</label><select name="squad">'+['Team A','Team B','Under 17','Under 13','Under 10'].map(function(s){return '<option'+(m.squad===s?' selected':'')+'>'+s+'</option>'}).join('')+'</select></div><div><label>Opponent</label><input name="opp" value="'+esc(m.opp)+'" required></div></div><div class="r2"><div><label>Date and kick-off</label><input type="datetime-local" name="date" value="'+loc(m.date)+'" required></div><div><label>Venue</label><select name="home"><option value="1"'+(m.home?' selected':'')+'>Home</option><option value="0"'+(m.home?'':' selected')+'>Away</option></select></div></div><div class="r2"><div><label>Competition</label><select name="comp">'+['League','Cup','Friendly','Tournament'].map(function(s){return '<option'+(m.comp===s?' selected':'')+'>'+s+'</option>'}).join('')+'</select></div><div><label>Ticket price (KSh)</label><input type="number" name="price" value="'+(m.price==null?100:m.price)+'"></div></div>'
  +(r?'<div class="r3"><div><label>Our goals</label><input type="number" name="sf" min="0" value="'+(m.sf||0)+'"></div><div><label>Their goals</label><input type="number" name="sa" min="0" value="'+(m.sa||0)+'"></div><div><label>Attendance</label><input type="number" name="att" min="0" value="'+(m.att||'')+'"></div></div><label>Scorers (e.g. B. Mwangi 23, K. Otieno 78)</label><input name="scorers" value="'+esc(m.scorers||'')+'"><div class="r2"><div><label>Player of the match</label><input name="motm" value="'+esc(m.motm||'')+'"></div><div><label>Why (short)</label><input name="motmWhy" value="'+esc(m.motmWhy||'')+'"></div></div><label>Match report</label><textarea name="report" placeholder="Write a short story of the game...">'+esc(m.report||'')+'</textarea><label>Match photos</label><div id="mph">'+thumbs(m.photos,'mph')+'</div><button type="button" class="btn sm dk" data-addph="mph" style="margin-top:8px">+ Upload photos</button>':'')
  +'<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px"><button class="btn" type="submit">'+(r?'Publish result':'Save fixture')+'</button><button type="button" class="btn dk" data-cancel="1">Cancel</button>'+(m.id?'<button type="button" class="btn bad" data-del="matches:'+m.id+'">Delete</button>':'')+'</div>'
  +(m.id&&r?'<div style="margin-top:16px;border-top:1px solid var(--ln);padding-top:12px"><label>Schedule a rematch (venue flips)</label><div style="display:flex;gap:8px"><input type="datetime-local" id="rm" value="'+loc(Date.now()+14*864e5)+'"><button type="button" class="btn sm" data-rematch="'+m.id+'" style="flex:none">Rematch</button></div></div>':'')+'<div class="err" id="mfe"></div></form>'}
/* ---------- news ---------- */
V.news=function(){return api('/api/admin/posts').then(function(ps){var h='<div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px"><h1 style="font-size:36px">News</h1><button class="btn sm" data-new="post">+ Post</button></div>';
  if(EDIT&&EDIT.k==='post'){var p=EDIT.v;h+='<form class="card" id="pf"><div class="r2"><div><label>Category</label><select name="cat">'+['Match','Academy','Community','Club'].map(function(s){return '<option'+(p.cat===s?' selected':'')+'>'+s+'</option>'}).join('')+'</select></div><div><label>Headline</label><input name="title" value="'+esc(p.title||'')+'" required></div></div><label>Story</label><textarea name="body" required>'+esc(p.body||'')+'</textarea><label>Photo</label><div id="pph">'+(p.img?thumbs([p.img],'pph'):'')+'</div><button type="button" class="btn sm dk" data-addph="pph" style="margin-top:8px">+ Upload photo</button><div style="display:flex;gap:8px;margin-top:16px"><button class="btn" type="submit">Publish</button><button type="button" class="btn dk" data-cancel="1">Cancel</button>'+(p.id?'<button type="button" class="btn bad" data-del="posts:'+p.id+'">Delete</button>':'')+'</div></form>'}
  h+='<div class="card">'+(ps.length?ps.map(function(p){return '<div class="row"><div style="display:flex;gap:10px;align-items:center">'+(p.img?'<img src="/'+esc(p.img)+'" alt="" style="width:54px;height:54px;border-radius:8px;object-fit:cover">':'')+'<div><b>'+esc(p.title)+'</b><br><small>'+esc(p.cat)+' · '+fd(p.at)+'</small></div></div><button class="btn sm dk" data-edit="post:'+p.id+'">Edit</button></div>'}).join(''):'<p class="note">No posts yet.</p>')+'</div>';$('#main').innerHTML=h;window._ps=ps})};
V.gallery=function(){return api('/api/admin/gallery').then(function(gs){$('#main').innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px"><h1 style="font-size:36px">Gallery</h1><button class="btn sm" data-gup="1">+ Upload photos</button></div><div class="card"><div class="ph" style="gap:12px">'+gs.map(function(g){return '<div style="width:140px;height:140px"><img src="/'+esc(g.url)+'" alt=""><button data-gdel="'+g.id+'" aria-label="Delete">&times;</button></div>'}).join('')+'</div>'+(gs.length?'':'<p class="note">No photos yet.</p>')+'</div>'})};
V.orders=function(){return api('/api/admin/orders').then(function(os){$('#main').innerHTML='<h1 style="font-size:36px;margin-top:6px">Orders</h1><p class="note">Merchandise and tickets sold on your site. The parent store processes them.</p><div class="card">'+orderTable(os,0)+'</div>'})};
function orderTable(os,showTeam){if(!os.length)return '<p class="note">No orders yet.</p>';return '<table><tr><th>Order</th>'+(showTeam?'<th>Team</th>':'')+'<th>Items</th><th class="num">Total</th><th class="num">To club</th><th>Status</th></tr>'+os.map(function(o){return '<tr><td><b>'+esc(o.id)+'</b><br><small class="note">'+fd(o.at)+'<br>'+esc(o.name)+'</small></td>'+(showTeam?'<td>'+esc(o.team)+'</td>':'')+'<td>'+o.items.map(function(i,ix){return esc(i.title)+(showTeam&&i.kind==='kit'?' <button class="chip" style="padding:3px 9px;font-size:11px" data-print="'+o.id+':'+ix+'">Print file</button>':'')+(i.detail?' <span class="note">('+esc(i.detail)+')</span>':'')}).join('<br>')+(o.delivery?'<br><small class="note">'+esc(o.delivery.label)+': '+esc(o.delivery.method==='pickup'?o.delivery.point+', '+o.delivery.town:o.delivery.address+', '+o.delivery.town)+'</small>':'')+(o.status==='awaiting_payment'?'<br><span class="pill y">waiting for M-Pesa</span>':'')+'</td><td class="num">'+KES(o.total)+'</td><td class="num">'+KES(o.club)+'</td><td>'+(showTeam?'<select data-ost="'+o.id+'" style="min-height:34px;padding:4px">'+['new','processed','shipped','cancelled'].map(function(s){return '<option'+(o.status===s?' selected':'')+'>'+s+'</option>'}).join('')+'</select>':'<span class="pill '+(o.status==='new'?'y':'g')+'">'+o.status+'</span>')+'</td></tr>'}).join('')+'</table>'}
V.fans=function(){return api('/api/admin/fans').then(function(fs){$('#main').innerHTML='<h1 style="font-size:36px;margin-top:6px">Fans</h1><div class="card">'+(fs.length?fs.map(function(f){return '<div class="row"><div><b>'+esc(f.name)+'</b><br><small>'+esc(f.phone)+(f.sms?' · SMS ok':'')+'</small></div><small>'+fd(f.at)+'</small></div>'}).join(''):'<p class="note">No fan sign-ups yet.</p>')+'</div>'})};
/* ---------- super ---------- */

const cache = {};
const FIELDS = {
  players: [['n', 'Name', 'text'], ['sq', 'Squad', 'squad'], ['pos', 'Position', 'text'], ['no', 'Shirt number', 'number'], ['age', 'Age', 'number'], ['g', 'Goals', 'number'], ['a', 'Assists', 'number'], ['ap', 'Appearances', 'number'], ['bio', 'Short bio', 'textarea'], ['star', 'Show a Rising star badge', 'check']],
  standings: [['n', 'Club', 'text'], ['w', 'Won', 'number'], ['d', 'Drawn', 'number'], ['l', 'Lost', 'number'], ['us', 'This is our club', 'check']],
  training: [['sq', 'Squad', 'squad'], ['days', 'Days (for example Tue & Thu)', 'text'], ['time', 'Time (for example 16:30)', 'text']],
  funds: [['t', 'Name of the goal', 'text'], ['acct', 'Account word (for example BOOTS)', 'text'], ['goal', 'Goal (KSh)', 'number'], ['got', 'Raised so far (KSh)', 'number'], ['d', 'What it pays for', 'textarea']]
};
const sqName = (id) => ((cache.squads || []).find(s => s.id === id) || {}).name || id;
function fieldHTML(d, v, squads) {
  const k = d[0], t = d[2], val = v[k] == null ? '' : v[k], full = t === 'textarea' || t === 'check' ? ' style="grid-column:1/-1"' : '';
  if (t === 'check') return `<label class="chk" style="grid-column:1/-1;display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-size:14px;color:#fff"><input type="checkbox" name="${k}" style="width:20px;min-height:0"${v[k] ? ' checked' : ''}> ${d[1]}</label>`;
  let inp;
  if (t === 'squad') inp = `<select name="${k}">${squads.map(s => `<option value="${esc(s.id)}"${val === s.id ? ' selected' : ''}>${esc(s.name)}</option>`).join('')}</select>`;
  else if (t === 'textarea') inp = `<textarea name="${k}" style="min-height:80px">${esc(val)}</textarea>`;
  else inp = `<input name="${k}" type="${t === 'number' ? 'number' : 'text'}" value="${esc(val)}"${t === 'number' ? ' inputmode="numeric"' : ''}>`;
  return `<div${full}><label>${d[1]}</label>${inp}</div>`;
}
function crud(kind, title, intro, rowFn, empty, blank) {
  return Promise.all([api('/api/admin/' + kind), api('/api/admin/profile')]).then(([rows, prof]) => {
    cache[kind] = rows; cache.squads = prof.squads;
    let h = `<div style="display:flex;justify-content:space-between;align-items:center;margin-top:6px"><h1 style="font-size:36px">${title}</h1><button class="btn sm" data-cnew="${kind}">+ Add</button></div><p class="note">${intro}</p>`;
    if (EDIT && EDIT.k === kind) h += `<form class="card" data-crud="${kind}"><h3 style="font-size:24px">${EDIT.v.id ? 'Edit' : 'Add'}</h3><div class="r2">${FIELDS[kind].map(d => fieldHTML(d, EDIT.v, prof.squads)).join('')}</div><div style="display:flex;gap:8px;margin-top:16px"><button class="btn" type="submit">Save</button><button type="button" class="btn dk" data-cancel="1">Cancel</button></div><div class="err" data-cerr></div></form>`;
    h += `<div class="card">${rows.length ? rows.map(rowFn).join('') : `<p class="note">${empty}</p>`}</div>`;
    $('#main').innerHTML = h; window._blank = blank;
  });
}

function saveProfile(f) {
  const v = (n) => f.elements[n].value, lines = (n) => v(n).split('\n').map(x => x.trim()).filter(Boolean);
  return api('/api/admin/profile', { method: 'PUT', body: {
    name: v('name'), short: v('short'), est: +v('est'), motto: v('motto'), town: v('town'), ground: v('ground'), contactPhone: v('contactPhone'), about: v('about'), coachWord: { q: v('cq'), by: v('cby') },
    primary: v('primary'), secondary: v('secondary'), crest: cache.prof.crest, paybillNote: v('paybillNote'),
    features: { shop: f.elements.f_shop.checked, tickets: f.elements.f_tickets.checked, fundraising: f.elements.f_fundraising.checked, training: f.elements.f_training.checked },
    squads: lines('squads').map(l => { const p = l.split('|'); return { id: (p[0] || '').trim(), name: (p[1] || '').trim() }; }),
    honours: lines('honours').map(l => { const p = l.split('|'); return { pos: +p[0], label: (p[1] || '').trim() }; }),
    packs: lines('packs').map((l, i) => { const p = l.split('|'); return { id: 'p' + i, t: (p[0] || '').trim(), p: parseInt(p[1], 10) || 0, d: (p[2] || '').trim() }; })
  } });
}

  $('#main').innerHTML = h; if (EDIT && EDIT.k === 'kit') kitLive();
});
function kitForm(v, L) {
  const s = v.spec, col = (k, lab) => `<div><label>${lab}</label><input type="color" name="${k}" value="${s[k]}"></div>`;
  return `<form class="card" id="kf"><h3 style="font-size:24px">${v.id ? 'Edit kit' : 'New kit'}</h3>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--s2);border-radius:12px;padding:8px;margin-top:8px" id="kpv"></div>
  <div class="r2"><div><label>Name</label><input name="name" maxlength="40" value="${esc(v.name)}"></div><div><label>Type</label><select name="kind">${L.kinds.map(k => `<option${v.kind === k ? ' selected' : ''}>${k}</option>`).join('')}</select></div></div>
  <div class="r2">${col('body', 'Shirt')}${col('accent', 'Pattern')}</div><div class="r2">${col('trim', 'Collar and cuffs')}${col('text', 'Name and number')}</div>
  <div class="r2"><div><label>Pattern</label><select name="texture">${L.textures.map(t => `<option value="${t.id}"${s.texture === t.id ? ' selected' : ''}>${t.label}</option>`).join('')}</select></div><div><label>Chest sponsor (max ${L.maxSponsorChars} letters)</label><input name="sponsor" maxlength="${L.maxSponsorChars}" value="${esc(v.sponsor || '')}"></div></div>
  <div class="r2"><div><label>Your mark-up (KSh)</label><input type="number" name="markup" min="${L.minMarkup}" max="${L.maxMarkup}" value="${v.markup}" inputmode="numeric"></div><div><label>Orders close on (optional)</label><input type="date" name="closes" value="${v.closes ? v.closes.slice(0, 10) : ''}"></div></div>
  <p class="note" id="kprice" style="margin-top:8px"></p>
  <label style="display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0;font-size:14px;color:#fff"><input type="checkbox" name="active" style="width:20px;min-height:0"${v.active !== false ? ' checked' : ''}> Put on sale</label>
  <div class="err" id="kerr"></div>
  <div style="display:flex;gap:8px;margin-top:14px"><button class="btn" type="submit" id="ksave">Save kit</button><button type="button" class="btn dk" data-cancel="1">Cancel</button></div></form>`;
}
function kitRead() { const f = $('#kf'), e = f.elements; return { name: e.name.value, kind: e.kind.value, spec: { body: e.body.value, accent: e.accent.value, trim: e.trim.value, text: e.text.value, texture: e.texture.value }, sponsor: e.sponsor.value, markup: +e.markup.value || 0, closes: e.closes.value ? new Date(e.closes.value + 'T23:59:59').toISOString() : null, active: e.active.checked }; }
function kitLive() {
  const L = cache.kl, k = kitRead(), r = Kit.validate(k.spec, { minContrast: L.minContrast });
  $('#kpv').innerHTML = kitPair(k.spec, k.sponsor, 'pv');
  const m = Math.min(L.maxMarkup, Math.max(L.minMarkup, k.markup));
  $('#kprice').innerHTML = `Fans pay <b>${KES(L.base + m)}</b> (plus delivery). You earn about <b>${KES(Math.round(m * (100 - L.feePct) / 100))}</b> per shirt.`;
  $('#kerr').textContent = r.errors[0] || ''; $('#ksave').disabled = !!r.errors.length;
}
const kitBody = (k, over) => Object.assign({ name: k.name, kind: k.kind, spec: k.spec, sponsor: k.sponsor, markup: k.markup, closes: k.closes, active: k.active }, over || {});

/* ---------- events ---------- */
var main=$('#main');
function flash(p){return p.then(function(){toast('Saved');show()}).catch(function(e){toast(e.message)})}
main.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var g=function(a){return b.getAttribute(a)};
  if(g('data-go')){TAB=g('data-go');tabs();show();return}
  if(g('data-manage')){CTX=g('data-manage');TAB='dash';$('#back').hidden=false;tabs();show();return}
  if(g('data-new')==='match'){EDIT={k:'match',v:{status:'fixture',date:new Date(Date.now()+7*864e5).toISOString(),home:true,price:100,photos:[]}};show();return}
  if(g('data-new')==='post'){EDIT={k:'post',v:{cat:'Match'}};show();return}
  if(g('data-edit')){var p=g('data-edit').split(':');EDIT={k:p[0],v:JSON.parse(JSON.stringify((p[0]==='match'?window._ms:window._ps).filter(function(x){return x.id===p[1]})[0]))};show();return}
  if(g('data-res')){var m=window._ms.filter(function(x){return x.id===g('data-res')})[0];EDIT={k:'match',v:Object.assign(JSON.parse(JSON.stringify(m)),{status:'result',photos:m.photos||[]})};show();return}
  if(g('data-cancel')){EDIT=null;show();return}
  if(g('data-cnew')){var ck=g('data-cnew');EDIT={k:ck,v:Object.assign({sq:(cache.squads&&cache.squads[0]||{}).id||'A'},window._blank||{})};show();return}
  if(g('data-cedit')){var ce=g('data-cedit').split(':');EDIT={k:ce[0],v:JSON.parse(JSON.stringify(cache[ce[0]].filter(function(x){return x.id===ce[1]})[0]))};show();return}
  if(g('data-cdel')){if(!confirm('Delete this?'))return;var cd=g('data-cdel').split(':');EDIT=null;flash(api('/api/admin/'+cd[0]+'/'+cd[1],{method:'DELETE'}));return}
  if(g('data-crest')){pick(false,function(u){cache.prof.crest=u[0];$('#cpv').innerHTML='<img src="/'+u[0]+'" alt="" style="width:100%;height:100%;object-fit:contain">'});return}
  if(g('data-knew')){var cp=cache.prof||{};var ak=Kit.autoKits(cp.primary||'#1fa463',cp.secondary||'#ffffff')[0];EDIT={k:'kit',v:{name:'',kind:'home',spec:ak.spec,sponsor:'',markup:650,active:true}};show();return}
  if(g('data-kedit')){EDIT={k:'kit',v:JSON.parse(JSON.stringify(cache.kits.filter(function(x){return x.id===g('data-kedit')})[0]))};show();return}
  if(g('data-ktog')){var kk=cache.kits.filter(function(x){return x.id===g('data-ktog')})[0];flash(api('/api/admin/kits/'+kk.id,{method:'PUT',body:kitBody(kk,{active:!kk.active})}));return}
  if(g('data-kdel')){if(!confirm('Delete this kit? Past orders keep their details.'))return;flash(api('/api/admin/kits/'+g('data-kdel'),{method:'DELETE'}));return}
  if(g('data-appr')){var ap=g('data-appr').split(':');flash(api('/api/super/teams/'+ap[0],{method:'PUT',body:{approved:ap[1]==='1'}}));return}
  if(g('data-print')){var pr=g('data-print').split(':');['back','front'].forEach(function(vw){fetch('/api/super/orders/'+pr[0]+'/print?i='+pr[1]+'&view='+vw,{headers:{Authorization:'Bearer '+tok}}).then(function(r){return r.ok?r.blob():r.json().then(function(j){throw new Error(j.error)})}).then(function(bl){window.open(URL.createObjectURL(bl),'_blank')}).catch(function(er){toast(er.message)})});return}
  if(g('data-addph')){var k=g('data-addph');pick(k==='mph',function(urls){if(k==='mph'){EDIT.v.photos=(EDIT.v.photos||[]).concat(urls);$('#mph').innerHTML=thumbs(EDIT.v.photos,'mph')}else{EDIT.v.img=urls[0];$('#pph').innerHTML=thumbs([urls[0]],'pph')}});return}
  if(g('data-rm')){var q=g('data-rm').split(':');if(q[0]==='mph'){EDIT.v.photos.splice(+q[1],1);$('#mph').innerHTML=thumbs(EDIT.v.photos,'mph')}else{EDIT.v.img=null;$('#pph').innerHTML=''}return}
  if(g('data-del')){if(!confirm('Delete this?'))return;var d=g('data-del').split(':');EDIT=null;flash(api('/api/admin/'+d[0]+'/'+d[1],{method:'DELETE'}));return}
  if(g('data-rematch')){flash(api('/api/admin/matches/'+g('data-rematch')+'/rematch',{method:'POST',body:{date:$('#rm').value}}).then(function(){EDIT=null}));return}
  if(g('data-gup')){pick(true,function(urls){Promise.all(urls.map(function(u){return api('/api/admin/gallery',{method:'POST',body:{url:u,caption:''}})})).then(function(){toast('Uploaded');show()})});return}
  if(g('data-gdel')){flash(api('/api/admin/gallery/'+g('data-gdel'),{method:'DELETE'}));return}
  if(g('data-tog')){var t=g('data-tog').split(':');flash(api('/api/super/teams/'+t[0],{method:'PUT',body:{active:t[1]==='1'}}));return}
  if(g('data-pw')){var pw=prompt('New password for this team (6+ characters)');if(pw)flash(api('/api/super/teams/'+g('data-pw'),{method:'PUT',body:{newPass:pw}}));return}
  if(g('data-ptog')){var z=g('data-ptog').split(':');flash(api('/api/super/products/'+z[0],{method:'PUT',body:{active:z[1]==='1'}}));return}
  if(g('data-pdel')){if(confirm('Remove product?'))flash(api('/api/super/products/'+g('data-pdel'),{method:'DELETE'}));return}
});
main.addEventListener('change',function(e){var t=e.target;if(t.getAttribute('data-lead')){flash(api('/api/admin/leads/'+t.getAttribute('data-lead'),{method:'PUT',body:{status:t.value}}));return}if(t.getAttribute('data-ost'))flash(api('/api/super/orders/'+t.getAttribute('data-ost'),{method:'PUT',body:{status:t.value}}));if(t.getAttribute('data-pp'))flash(api('/api/super/products/'+t.getAttribute('data-pp'),{method:'PUT',body:{price:+t.value}}))});
main.addEventListener('input',function(e){if(e.target.form&&e.target.form.id==='kf')kitLive()});
function fv(f){var o={};Array.prototype.forEach.call(f.elements,function(el){if(el.name)o[el.name]=el.value});return o}
main.addEventListener('submit',function(e){e.preventDefault();var f=e.target,v=fv(f);
  if(f.id==='prof'){flash(saveProfile(f));return}
  if(f.id==='kf'){var kb=kitRead(),kv=EDIT.v;api('/api/admin/kits'+(kv.id?'/'+kv.id:''),{method:kv.id?'PUT':'POST',body:kb}).then(function(){EDIT=null;toast('Kit saved');show()}).catch(function(er){$('#kerr').textContent=er.message});return}
  if(f.id==='kf2'){flash(api('/api/super/settings',{method:'PUT',body:{kit:{base:+v.base,feePct:+v.feePct,minMarkup:+v.minMarkup,maxMarkup:+v.maxMarkup},delivery:{pickup:{fee:+v.pickup},parcel:{fee:+v.parcel}},design:{minContrast:+v.minContrast,maxSponsorChars:+v.maxSponsorChars}}}));return}
  if(f.getAttribute('data-crud')){var ck=f.getAttribute('data-crud'),o={};FIELDS[ck].forEach(function(d){var el=f.elements[d[0]];o[d[0]]=d[2]==='check'?el.checked:d[2]==='number'?(+el.value||0):el.value});var cid=EDIT.v.id;api('/api/admin/'+ck+(cid?'/'+cid:''),{method:cid?'PUT':'POST',body:o}).then(function(){EDIT=null;toast('Saved');show()}).catch(function(er){f.querySelector('[data-cerr]').textContent=er.message});return}
  if(f.id==='mf'){var m=EDIT.v,body={squad:v.squad,opp:v.opp,date:new Date(v.date).toISOString(),home:v.home==='1',comp:v.comp,price:+v.price,status:m.status};if(m.status==='result'){Object.assign(body,{sf:+v.sf,sa:+v.sa,att:+v.att,scorers:v.scorers,motm:v.motm,motmWhy:v.motmWhy,report:v.report,photos:m.photos||[]})}
    api('/api/admin/matches'+(m.id?'/'+m.id:''),{method:m.id?'PUT':'POST',body:body}).then(function(){EDIT=null;toast(m.status==='result'?'Result published':'Saved');show()}).catch(function(er){$('#mfe').textContent=er.message});return}
  if(f.id==='pf'){var p=EDIT.v;api('/api/admin/posts'+(p.id?'/'+p.id:''),{method:p.id?'PUT':'POST',body:{cat:v.cat,title:v.title,body:v.body,img:p.img||null}}).then(function(){EDIT=null;toast('Published');show()}).catch(function(er){toast(er.message)});return}
  if(f.id==='tf'){api('/api/super/teams',{method:'POST',body:v}).then(function(){toast('Team created');show()}).catch(function(er){$('#tfe').textContent=er.message});return}
  if(f.id==='sf'){flash(api('/api/super/settings',{method:'PUT',body:{jerseyPrice:+v.jerseyPrice,fanDiscount:+v.fanDiscount,share:{shirt:+v.shirt,merch:+v.merch,ticket:+v.ticket}}}));return}
  if(f.id==='pf2'){flash(api('/api/super/products',{method:'POST',body:{title:v.title,price:+v.price,art:v.art}}));return}
  if(f.id==='paf'){api('/api/super/payouts',{method:'POST',body:v}).then(function(){toast('Payout recorded');show()}).catch(function(er){$('#pae').textContent=er.message});return}
});
try{var s=sessionStorage.getItem('tok');if(s){tok=s;api('/api/me').then(function(m){ME=m;start()}).catch(function(){signOut()})}}catch(e){}
})();
</script></body></html>
