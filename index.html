<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0f">
<title>Mathaithi United FC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Club app: the crest sets --accent / --on (see themeFromImage). Dark app shell, bright accent blocks,
   a bottom tab bar, a ticker strip, a hero carousel, a membership card and a chat-style prompt. */
:root{--accent:#f6c400;--on:#0b0b0f;--bg:#0b0b0f;--s1:#15151c;--s2:#1e1e27;--line:#2a2a35;--tx:#fff;--mut:#a3a3b2;--ok:#2ecc71;--r:16px;--tab:64px;--disp:'Barlow Condensed',Impact,'Arial Narrow',sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font:400 15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 12px)}
img,svg{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
a{color:inherit}
h1,h2,h3,.disp{font-family:var(--disp);font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:1}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 16px}
/* top bar */
.top{position:sticky;top:0;z-index:40;background:rgba(11,11,15,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .in{max-width:760px;margin:0 auto;height:56px;padding:0 12px;display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-align:left}
.brand .cr{width:36px;height:36px;flex:none}.brand .cr img,.brand .cr svg{width:100%;height:100%;object-fit:contain}
.brand b{font-family:var(--disp);font-size:20px;text-transform:uppercase;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{position:relative;width:40px;height:40px;border-radius:12px;background:var(--s1);display:grid;place-items:center}
.ib svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib .n{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--on);font:700 11px/18px Inter;text-align:center;padding:0 4px}
/* ticker */
.ticker{background:var(--accent);color:var(--on);overflow:hidden;white-space:nowrap;font:700 13px/34px Inter;text-transform:uppercase;letter-spacing:.04em}
.ticker .tk{display:inline-block;padding-left:100%;animation:tk 38s linear infinite}
.ticker span{margin-right:42px}.ticker span:before{content:"";display:inline-block;width:8px;height:8px;background:var(--on);transform:rotate(45deg);margin-right:12px}
@keyframes tk{to{transform:translateX(-100%)}}
/* views */
.view{padding-bottom:20px;animation:vin .28s ease}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sec{padding:22px 0 0}
.sh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.sh h2{font-size:26px}.sh a,.sh button{font:700 13px Inter;color:var(--accent);text-transform:none}
.pg{padding:18px 0 4px}.pg h1{font-size:40px}.pg p{color:var(--mut);margin-top:6px}
/* hero carousel */
.hero{position:relative}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:start;position:relative;min-height:380px;display:flex;align-items:flex-end;overflow:hidden}
.slide>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slide:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,11,15,.05) 20%,rgba(11,11,15,.92) 92%)}
.slide .cp{position:relative;z-index:2;padding:20px 16px 44px;max-width:760px;margin:0 auto;width:100%}
.tag{display:inline-block;background:var(--accent);color:var(--on);font:800 11px/1 Inter;text-transform:uppercase;letter-spacing:.08em;padding:6px 9px;border-radius:6px;margin-bottom:10px}
.slide h2{font-size:clamp(34px,9vw,56px);margin-bottom:8px}
.slide p{color:#e5e5ee;max-width:34ch;margin-bottom:14px}
.dots{position:absolute;bottom:14px;left:0;right:0;display:flex;justify-content:center;gap:7px;z-index:3}
.dots i{width:7px;height:7px;border-radius:4px;background:rgba(255,255,255,.45);transition:.25s}.dots i.on{width:24px;background:var(--accent)}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:999px;background:var(--accent);color:var(--on);font:800 14px Inter;text-transform:uppercase;letter-spacing:.04em;transition:transform .12s}
.btn:active{transform:scale(.96)}
.btn.line{background:transparent;color:#fff;box-shadow:inset 0 0 0 2px #fff}
.btn.dk{background:var(--s2);color:#fff}
.btn.sm{min-height:36px;padding:0 14px;font-size:12px}
.btn.blk{width:100%}
.lnk{color:var(--mut);font-size:13px;text-decoration:underline;padding:10px}
/* quick actions */
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:-26px;position:relative;z-index:5}
.qa button{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:7px;font:700 11px Inter;text-transform:uppercase;letter-spacing:.04em;transition:transform .12s}
.qa button:active{transform:scale(.95)}
.qa svg{width:24px;height:24px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
/* cards */
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.pad{padding:16px}
.hs{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x proximity;padding:2px 16px 8px;margin:0 -16px;scrollbar-width:none}
.hs::-webkit-scrollbar{display:none}.hs>*{flex:none;scroll-snap-align:start}
.nc{width:250px;background:var(--s1);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-align:left;transition:transform .15s}
.nc:active{transform:scale(.97)}
.nc img{width:100%;height:140px;object-fit:cover}
.nc div{padding:12px}.nc small{color:var(--accent);font:700 11px Inter;text-transform:uppercase;letter-spacing:.06em}
.nc h3{font-size:20px;margin-top:6px;line-height:1.05}
.nc time{display:block;color:var(--mut);font-size:12px;margin-top:6px}
/* membership card */
.mc{position:relative;border-radius:20px;padding:18px;background:var(--accent);color:var(--on);overflow:hidden;min-height:196px;display:flex;flex-direction:column;justify-content:space-between}
.mc:before{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(0,0,0,.09)}
.mc:after{content:"";position:absolute;right:30px;bottom:-90px;width:200px;height:200px;border-radius:50%;background:rgba(0,0,0,.07)}
.mc>*{position:relative;z-index:1}
.mc .r1{display:flex;justify-content:space-between;align-items:flex-start}
.mc .cr{width:46px;height:46px}.mc .cr img,.mc .cr svg{width:100%;height:100%;object-fit:contain}
.mc .tier{font:800 11px Inter;text-transform:uppercase;letter-spacing:.1em;background:var(--on);color:var(--accent);padding:5px 9px;border-radius:6px}
.mc .nm{font:800 30px/1 var(--disp);text-transform:uppercase}
.mc .no{font:600 12px Inter;letter-spacing:.14em;opacity:.8;margin-top:4px}
.mc .bar{height:6px;background:rgba(0,0,0,.18);border-radius:3px;margin-top:12px;overflow:hidden}.mc .bar i{display:block;height:100%;background:var(--on);border-radius:3px}
.mc .bc{height:26px;margin-top:10px;opacity:.85}
.mc.empty{background:var(--s1);color:#fff;border:2px dashed var(--accent)}
.mc.empty:before,.mc.empty:after{display:none}
/* fixtures */
.fx{display:grid;grid-template-columns:54px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.fx:last-child{border:0}
.fx .dt{text-align:center;background:var(--s2);border-radius:10px;padding:6px 0;font:800 11px Inter;text-transform:uppercase;color:var(--mut)}.fx .dt b{display:block;font:800 24px/1 var(--disp);color:#fff}
.fx h4{font:800 18px/1.1 var(--disp);text-transform:uppercase}.fx small{color:var(--mut)}
.fx .ac{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.pill{display:inline-block;font:700 11px Inter;padding:3px 8px;border-radius:999px;background:var(--s2);color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.pill.w{background:rgba(46,204,113,.16);color:var(--ok)}.pill.l{background:rgba(255,80,80,.16);color:#ff6b6b}.pill.a{background:var(--accent);color:var(--on)}
.nx{position:relative;border-radius:20px;overflow:hidden;padding:18px;background:var(--s1);border:1px solid var(--line)}
.nx .vs{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:14px 0}
.nx .tm{flex:1;text-align:center;font:800 20px/1.1 var(--disp);text-transform:uppercase}.nx .tm .cr{width:56px;height:56px;margin:0 auto 8px;border-radius:50%;background:var(--s2);display:grid;place-items:center;overflow:hidden}
.nx .tm .cr img,.nx .tm .cr svg{width:100%;height:100%;object-fit:contain}
.nx .vsx{font:800 14px Inter;color:var(--mut)}
.cd{display:flex;gap:8px;justify-content:center;margin-bottom:14px}.cd div{background:var(--s2);border-radius:10px;min-width:56px;padding:8px 0;text-align:center}.cd b{display:block;font:800 26px/1 var(--disp)}.cd small{font-size:10px;text-transform:uppercase;color:var(--mut);letter-spacing:.08em}
/* tables */
.tbl{width:100%;border-collapse:collapse;font-size:14px}.tbl th{font:700 11px Inter;text-transform:uppercase;color:var(--mut);text-align:right;padding:8px 6px;letter-spacing:.06em}.tbl th:nth-child(2),.tbl td:nth-child(2){text-align:left}
.tbl td{padding:10px 6px;text-align:right;border-top:1px solid var(--line)}.tbl tr.me td{background:rgba(255,255,255,.05);font-weight:700}.tbl tr.me td:first-child{box-shadow:inset 4px 0 var(--accent)}
.tbl td:first-child,.tbl th:first-child{text-align:center;width:34px;color:var(--mut)}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 12px}.tabs::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 15px;border-radius:999px;background:var(--s1);border:1px solid var(--line);font:700 13px Inter}
.chip[aria-pressed=true],.chip.on{background:var(--accent);color:var(--on);border-color:var(--accent)}
/* players */
.pl{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.pc{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;text-align:left;position:relative;transition:transform .15s}
.pc:active{transform:scale(.97)}
.pc .ph{height:150px;background:var(--accent);color:var(--on);display:grid;place-items:center;position:relative;overflow:hidden}
.pc .ph b{font:400 120px/1 Anton;opacity:.22;position:absolute;right:-6px;bottom:-16px}
.pc .ph svg{width:96px;height:96px;position:relative}
.pc .pi{padding:10px 12px}.pc .pi small{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.06em}.pc .pi h3{font-size:21px;margin-top:3px}
.pc .star{position:absolute;top:8px;left:8px;background:var(--on);color:var(--accent);font:800 10px Inter;padding:4px 8px;border-radius:6px;text-transform:uppercase;letter-spacing:.06em;z-index:2}
/* shop */
.mg{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.mi{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.mi .art{background:var(--s2);aspect-ratio:1;display:grid;place-items:center;padding:14px}.mi .art svg{max-height:100%}
.mi .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}.mi h3{font-size:19px}.mi .pr{font-weight:700;color:var(--accent)}
.mi .btn{margin-top:auto}
.drop{background:var(--accent);color:var(--on);border-radius:20px;padding:18px;display:grid;grid-template-columns:1fr 130px;gap:8px;align-items:center;text-align:left;width:100%}
.drop h2{font-size:34px;margin:6px 0 8px}.drop p{font-weight:500;font-size:14px;margin-bottom:12px}.drop .btn{background:var(--on);color:var(--accent)}
/* feed bits */
.cm{display:grid;grid-template-columns:36px 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.cm:first-child{border:0}.av{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--on);display:grid;place-items:center;font:800 15px Inter}
.cm small{color:var(--mut)}
.board{counter-reset:b}.bi{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:11px 14px;border-top:1px solid var(--line)}.bi:first-child{border:0}
.bi .md{width:28px;height:34px}.bi b{font-weight:700}.bi .pt{font:800 18px var(--disp)}
.prog{height:8px;background:var(--s2);border-radius:4px;overflow:hidden}.prog i{display:block;height:100%;background:var(--accent);border-radius:4px}
.spons{display:flex;gap:10px;overflow:hidden;position:relative}
.spons .tr{display:flex;gap:10px;animation:tk 26s linear infinite;flex:none}
.spons .sp{flex:none;width:130px;height:62px;border:1.5px dashed #4a4a58;border-radius:12px;display:grid;place-items:center;font:700 11px Inter;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);text-align:center}
@keyframes tk2{to{transform:translateX(-50%)}}
.spons .tr{animation-name:tk2}
/* forms */
label{display:block;font:700 12px Inter;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:14px 0 6px}
input[type=text],input[type=tel],input[type=number],input[type=email],select,textarea{width:100%;min-height:48px;padding:11px 14px;background:var(--s2);border:1.5px solid var(--line);border-radius:12px;color:#fff}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent)}
.chk{display:flex;gap:10px;align-items:flex-start;margin:14px 0;font-size:13px;color:var(--mut)}.chk input{width:20px;height:20px;accent-color:var(--accent);flex:none;margin-top:1px}
.note{font-size:12px;color:var(--mut)}.ok{color:var(--ok);font-weight:600}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-auto-flow:column;gap:6px;background:var(--s2);padding:4px;border-radius:12px}.seg button{padding:10px;border-radius:9px;font:700 13px Inter}.seg button[aria-pressed=true]{background:var(--accent);color:var(--on)}
.opts{display:grid;gap:8px}.opt{display:flex;justify-content:space-between;align-items:center;background:var(--s2);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;width:100%}.opt[aria-pressed=true]{border-color:var(--accent);background:rgba(255,255,255,.04)}
/* bottom tab */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:rgba(15,15,20,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar .in{max-width:760px;margin:0 auto;height:var(--tab);display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:700 10.5px Inter;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);position:relative;transition:color .15s}
.tabbar svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.tabbar button[aria-current=page]{color:var(--accent)}.tabbar button[aria-current=page] svg{transform:translateY(-2px) scale(1.08)}
.tabbar button[aria-current=page]:before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
/* sheets & drawers */
.ov{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.66);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--s1);border-radius:24px 24px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.8,.2,1);position:relative}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet .grab{width:42px;height:4px;border-radius:2px;background:var(--line);margin:-8px auto 14px}
.sx{position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:50%;background:var(--s2);font-size:20px;line-height:36px;text-align:center;z-index:2}
.menu a,.menu button{display:flex;align-items:center;gap:14px;width:100%;padding:14px 4px;border-top:1px solid var(--line);font:700 16px Inter;text-align:left;text-decoration:none}
.menu a:first-of-type{border:0}.menu svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.art-body p{margin:12px 0;color:#d8d8e2}.art-body img{border-radius:14px;margin:6px 0 4px;width:100%;max-height:260px;object-fit:cover}
/* jersey window */
.jwrap{position:fixed;inset:0;z-index:90;background:radial-gradient(circle at 50% 30%,rgba(255,255,255,.08),rgba(0,0,0,.9) 70%),rgba(0,0,0,.84);display:flex;align-items:center;justify-content:center;padding:14px;animation:fade .3s;overflow:auto}
.jbox{width:100%;max-width:400px;text-align:center;position:relative;animation:pop .45s cubic-bezier(.2,1.2,.3,1)}
@keyframes pop{from{transform:scale(.8) translateY(30px);opacity:0}}
.jbox h2{font-size:30px;margin-bottom:2px}.jbox>p{color:#d0d0da;font-size:14px;margin-bottom:6px}
.jshirt{position:relative;width:min(86vw,330px);margin:0 auto;container-type:inline-size;cursor:text;filter:drop-shadow(0 18px 24px rgba(0,0,0,.55))}
.jshirt .inp{position:absolute;left:50%;transform:translateX(-50%);background:transparent;border:0;text-align:center;font-family:Anton,Impact,sans-serif;text-transform:uppercase;width:54%;padding:0;min-height:0;border-radius:6px}
.jshirt .inp::placeholder{opacity:.45}
.jshirt .inp:focus{outline:none;background:rgba(255,255,255,.12)}
#jName{top:23.5%;font-size:9.5cqw;letter-spacing:.02em}
#jNum{top:34%;font-size:38cqw;line-height:1;width:60%}
.jshirt .pulse{position:absolute;left:50%;top:21.5%;transform:translateX(-50%);width:56%;height:11%;border:2px dashed rgba(255,255,255,.85);border-radius:8px;animation:pl 1.4s infinite;pointer-events:none}
@keyframes pl{50%{opacity:.25;transform:translateX(-50%) scale(1.05)}}
.jshirt .hint{position:absolute;left:0;right:0;top:64%;font:700 12px Inter;text-transform:uppercase;letter-spacing:.1em;text-align:center;pointer-events:none}
.spot{position:absolute;display:grid;place-items:center;text-align:center;font:800 9px/1.2 Inter;text-transform:uppercase;letter-spacing:.08em;border:1.5px dashed currentColor;border-radius:8px;background:rgba(255,255,255,.08);cursor:pointer;animation:pl 2s infinite}
.jctl{display:flex;gap:8px;justify-content:center;margin:12px 0 6px;flex-wrap:wrap}
.jctl .chip{padding:7px 13px;font-size:12px}
.jact{display:grid;gap:8px;margin-top:10px}
.jx{position:absolute;top:-4px;right:-4px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.14);font-size:19px;z-index:3}
.jbox .sub{display:block;margin:10px auto 0;color:#9a9aa8;font-size:12px;text-decoration:underline}
/* chat bubble */
.chatbtn{position:fixed;right:14px;bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 14px);z-index:60;width:58px;height:58px;border-radius:50%;background:var(--accent);box-shadow:0 8px 22px rgba(0,0,0,.5);display:grid;place-items:center;transition:transform .15s}
.chatbtn:active{transform:scale(.92)}
.chatbtn .cr{width:38px;height:38px}.chatbtn .cr img,.chatbtn .cr svg{width:100%;height:100%;object-fit:contain}
.chatbtn .dot{position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:#ff3b3b;border:2px solid var(--bg);animation:pl 1.2s infinite}
.tease{position:fixed;right:14px;bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 82px);z-index:60;max-width:230px;background:#fff;color:#111;border-radius:16px 16px 4px 16px;padding:11px 14px;font-weight:600;font-size:14px;box-shadow:0 8px 22px rgba(0,0,0,.45);animation:pop .4s}
.chat{position:fixed;right:12px;left:12px;bottom:calc(var(--tab) + env(safe-area-inset-bottom) + 12px);z-index:85;max-width:400px;margin-left:auto;background:var(--s1);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.6);animation:up .25s}
.chat .hd{background:var(--accent);color:var(--on);padding:12px 14px;display:flex;align-items:center;gap:10px}.chat .hd .cr{width:34px;height:34px}.chat .hd .cr img,.chat .hd .cr svg{width:100%;height:100%;object-fit:contain}

function shirtItem(j){var k=kitById(j.kit);return {k:'kit',ref:k.id,pname:j.name,num:j.num,size:j.size,t:CLUB.name+' '+k.name+' kit',d:(j.name?j.name.toUpperCase():'No name')+' · '+(j.num||'No number')+' · '+j.size,price:jPrice(j),disc:true,share:true}}

  var cd=$('#cd');if(cd){var t=+cd.getAttribute('data-t'),tick=function(){var d=Math.max(0,t-Date.now()),dd=Math.floor(d/864e5),hh=Math.floor(d%864e5/36e5),mm=Math.floor(d%36e5/6e4),ss2=Math.floor(d%6e4/1e3);cd.innerHTML=[[dd,'Days'],[hh,'Hrs'],[mm,'Min'],[ss2,'Sec']].map(function(x){return '<div><b>'+String(x[0]).padStart(2,'0')+'</b><small>'+x[1]+'</small></div>'}).join('')};tick();cdT=setInterval(tick,1000)}
  var sl=$('#slides');if(sl){var dots=$$('#dots i'),n=dots.length,cur=0,upd=function(){var i=Math.round(sl.scrollLeft/sl.clientWidth);dots.forEach(function(d,x){d.className=x===i?'on':''});cur=i};sl.addEventListener('scroll',upd,{passive:true});carT=setInterval(function(){cur=(cur+1)%n;sl.scrollTo({left:cur*sl.clientWidth,behavior:'smooth'})},5200)}
}

fetch('/api/public'+(/^\?team=\w+$/.test(location.search)?location.search:'')).then(function(r){return r.ok?r.json():Promise.reject()}).then(applyAPI).catch(function(){}).then(boot);
